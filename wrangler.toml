# Mandate — Cloudflare Workers + Static Assets
# Docs: docs/DEPLOY_CLOUDFLARE.md

name = "mandate"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[build]
command = ""

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
OPENAI_MODEL = "gpt-4o-mini"

# Secret (required for AI Agent):
#   npx wrangler secret put OPENAI_API_KEY

[observability]
enabled = true
